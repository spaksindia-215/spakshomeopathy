<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css" integrity="sha512-5A8nwdMOWrSz20fDsjczgUidUBR8liPYU+WymTZP1lmY9G6Oc7HlZv156XqnsgNUzTyMefFTcsFH/tnJE/+xBg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
       <link rel="stylesheet" type="text/css" href="style/style.css">
   <link rel="stylesheet" type="text/css" href="style/bootstrap.css">
       <link rel="stylesheet" type="text/css" href="style/responsive.css">
    <title>Patient Record | Spaks India Business Solutions Pvt. Ltd.</title>
  </head>
  <body class="bg2">
      
      
      <div class="container">
            <div class="row">
               <div class="col-lg-12 login-gridbox">
                  <div class="login-box">
                     <h3>Create Account!</h3>
                   
                      <form action="http://holidaytownie.com/userlogin/userregistration" method="POST">
                        <p>
                           <input type="text" name="name" id="name" placeholder="Username">
                           <i class="fa fa-user"></i>
                        </p>
                        <p>
                           <input type="email" name="email" id="email" placeholder="E-mail Address">
                           <i class="fa fa-envelope"></i>
                        </p>
                        <p>
                           <input type="password" name="pass" id="pass" placeholder="Password">
                           <i class="fa fa-lock"></i>
                        </p>
                        <p>
                           <input type="password" name="pass" id="pass" placeholder="Repeat Password">
                           <i class="fa fa-lock"></i>
                        </p>
                        <p class="register_action">
                           <button type="submit" style="background-color:#0688a6;">Register</button>
                        </p>
                     </form>
                      
                      
                      <div class="register_have">
                        <p>Already have an account? <a href="login.html">Login</a></p>
                     </div>
                   
                     
                  </div>
               </div>
            </div>
         </div>
      
      
      
      
      
      
   <script src="https://code.jquery.com/jquery-3.6.1.min.js" integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ=" crossorigin="anonymous"></script>
   <script src="js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  
      <script>
      $(document).ready(function() {
    $('.js-example-basic-multiple').select2();
});
      
      </script>
  </body>
</html>
